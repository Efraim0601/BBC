# Server deployment — HTTPS with a self-signed certificate.
# Mounted over the image default.conf by docker-compose.server.yml.

# HTTP -> HTTPS redirect. The public HTTPS port is 20443; if you remap it in
# docker-compose.server.yml, change the port here too.
server {
    listen 80;
    server_name _;
    return 301 https://$host:20443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend (internal docker network)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket (STOMP/SockJS) -> backend, with upgrade headers
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
