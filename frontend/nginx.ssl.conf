# Server deployment — HTTPS with a self-signed certificate.
# Mounted over the image default.conf by docker-compose.server.yml.

# HTTP -> HTTPS redirect. The public HTTPS port is 20443; if you remap it in
# docker-compose.server.yml, change the port here too.
server {
    listen 80;
    server_name _;
    return 301 https://$host:20443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;

    # Resolveur DNS interne de Docker, pour les proxy_pass a cible variable.
    resolver 127.0.0.11 ipv6=off valid=10s;
    index index.html;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Allow bulk imports (student registers sent as JSON) — default is only 1m.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    # Hashed build output (js/css) never changes content under the same name.
    # Actifs de l'application : leur nom porte un hachage de build, ils ne
    # changent jamais sous ce nom. La regex est ancree sur /app/ pour ne pas
    # capturer les fichiers du site institutionnel, servis par le conteneur
    # website — sans cette ancre, /assets/css/site.css serait cherche ici et
    # renverrait 404.
    location ~* ^/app/.+\.(?:js|css|woff2?|png|jpe?g|svg|ico|webp)$ {
        rewrite ^/app/(.*)$ /$1 break;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    #  Une seule origine pour le site institutionnel et l'application.
    #  Les jetons de session vivent dans localStorage, cloisonne par origine :
    #  la connexion faite sur le site n'ouvre une session dans l'application
    #  que si les deux partagent hote et port.
    #      /      -> site institutionnel (conteneur website)
    #      /app/  -> application, construite avec --base-href /app/
    #      /api/  -> API (proxifiee plus bas)
    # ------------------------------------------------------------------
    location = /app { return 301 /app/; }

    location /app/ {
        rewrite ^/app/?(.*)$ /$1 break;
        # « =404 » en dernier, et non /index.html : le dernier parametre de
        # try_files est traite comme une REDIRECTION INTERNE, qui repasserait
        # par le routage et retomberait sur `location /`, donc sur le site
        # institutionnel. Place avant, /index.html est servi comme un fichier.
        try_files $uri /index.html =404;
    }

    # Cible resolue a chaque requete (variable + resolver) : avec un nom
    # litteral, nginx refuserait de demarrer tant que le conteneur website
    # n'existe pas, et emporterait avec lui l'application et l'API.
    location / {
        set $bbc_site "website:80";
        proxy_pass http://$bbc_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API -> backend (internal docker network)
    location /api/ {
        proxy_pass http://backend:8080;
        # Un import de registre est une seule requête qui écrit toute une classe.
        # Le défaut nginx (60 s) la coupait en pleine écriture, laissant l'écran
        # sur « connexion interrompue » sans dire ce qui avait été enregistré.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket (STOMP/SockJS) -> backend, with upgrade headers
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
