server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow bulk imports (student registers sent as JSON) — default is only 1m.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    # Hashed build output (js/css) never changes content under the same name.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend
    location /api/ {
        proxy_pass http://backend:8080;
        # Un import de registre est une seule requête qui écrit toute une classe.
        # Le défaut nginx (60 s) la coupait en pleine écriture, laissant l'écran
        # sur « connexion interrompue » sans dire ce qui avait été enregistré.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (STOMP/SockJS) -> backend, with upgrade headers
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
