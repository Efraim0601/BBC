# Apercu local COMPLET : site institutionnel + application + API, sur une
# seule origine, exactement comme en deploiement.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml \
#     -f docker-compose.website-local.yml -p bbc-site up -d --build
#
#   → http://localhost:8081/           site institutionnel
#   → http://localhost:8081/connexion  page de connexion (demo : principal / password)
#   → http://localhost:8081/app/       application de gestion scolaire
#   → http://localhost:8081/api/       API
#
# Ce fichier monte la MEME configuration nginx que le deploiement VPS
# (frontend/nginx.ssl.production.conf, en HTTP simple) : ce qui est verifie
# ici est ce qui tournera en production, sans configuration parallele.
#
# Le stack de base (docker-compose.yml) reste inchange : sans cet override,
# l'application est servie a la racine comme avant, ce dont dependent les
# parcours Playwright de qa/browser-e2e.
services:
  website:
    build: ./website
    security_opt:
      - apparmor=unconfined
    expose:
      - "80"

  frontend:
    build:
      context: ./frontend
      args:
        BASE_HREF: /app/
    depends_on:
      - backend
      - website
    volumes:
      - ./frontend/nginx.ssl.production.conf:/etc/nginx/conf.d/default.conf:ro
