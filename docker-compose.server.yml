# ============================================================================
#  SERVER deployment stack — PRODUCTION + self-signed TLS.
#  Standalone compose file (not an override): deploy with ./deploy.sh
#  (or: make deploy). Ports are in the 20000-30000 range to avoid clashes;
#  only the frontend (HTTPS) is published — backend & db bind to localhost.
#
#    Frontend  : https://<host>:20443   (HTTP :20080 -> 301 HTTPS)
#    Backend   : 127.0.0.1:28080        (internal — SPA uses the nginx proxy)
#    Postgres  : 127.0.0.1:25432        (internal — admin/psql only)
# ============================================================================
name: bbc-server

services:
  db:
    image: postgres:16-alpine
    security_opt:
      - apparmor=unconfined
    environment:
      POSTGRES_DB: bbc_sms
      POSTGRES_USER: bbc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bbc}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - bbc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbc -d bbc_sms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    security_opt:
      - apparmor=unconfined
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bbc_sms
      DB_USER: bbc
      DB_PASSWORD: ${DB_PASSWORD:-bbc}
      # Same-origin behind the nginx TLS proxy; override for a real domain.
      BBC_CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://localhost:20443}
      # STRONGLY override in production (see .env.example):
      BBC_JWT_SECRET: ${BBC_JWT_SECRET:-Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
      # First-run admin bootstrap (empty DB only):
      BBC_ADMIN_USERNAME: ${BBC_ADMIN_USERNAME:-admin}
      BBC_ADMIN_PASSWORD: ${BBC_ADMIN_PASSWORD:-}
      BBC_ADMIN_NAME: ${BBC_ADMIN_NAME:-Administrateur}
      BBC_SCHOOL_NAME: ${BBC_SCHOOL_NAME:-Mon établissement}
      BBC_SCHOOL_CODE: ${BBC_SCHOOL_CODE:-SCHOOL}
    ports:
      - "127.0.0.1:28080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    security_opt:
      - apparmor=unconfined
    depends_on:
      - backend
    ports:
      - "20080:80"
      - "20443:443"
    volumes:
      - ./frontend/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs-tls:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  bbc_pgdata:
