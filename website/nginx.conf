server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    # En-tetes de securite : le site ne recoit aucune donnee, mais il porte le
    # nom de l'etablissement — on limite ce qu'un tiers peut en faire.
    #
    # ATTENTION : ne pas ajouter d'add_header dans un bloc location. nginx
    # n'herite des add_header du niveau superieur que si le niveau courant n'en
    # declare aucun : un seul add_header dans un location ferait disparaitre
    # tous ceux-ci de la reponse. Le cache est donc pilote par `expires`, qui
    # n'a pas cet effet de bord.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GSAP est servi depuis le site lui-meme : script-src 'self' suffit.
    # Les polices viennent de Google Fonts (voir le <head> des pages).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    # Par defaut : revalidation a chaque visite. Le HTML est modifie a la main
    # par le secretariat, une correction de texte doit se voir immediatement.
    expires -1;

    # Bibliotheques tierces : la version est dans le nom du fichier, le contenu
    # ne changera jamais sous ce nom.
    location ^~ /assets/js/vendor/ {
        expires 1y;
    }

    # Feuille de style et scripts du site : noms fixes, donc cache court, sinon
    # une correction mettrait un mois a atteindre les visiteurs.
    location ~* \.(?:css|js)$ {
        expires 1d;
    }

    location ~* \.(?:png|jpg|jpeg|svg|webp|ico|woff2)$ {
        expires 30d;
    }

    # ======================================================================
    #  Adossement au systeme de gestion scolaire
    #
    #  La page de connexion appelle /api/auth/login sur CETTE origine. C'est
    #  volontaire : les jetons de session vivent dans localStorage, qui est
    #  cloisonne par origine. Servir le site et l'application depuis le meme
    #  hote est la seule facon qu'une connexion faite ici ouvre une session
    #  la-bas. Cela evite aussi toute configuration CORS.
    #
    #  Le resolveur DNS interne de Docker est declare pour que les proxy_pass
    #  ci-dessous soient resolus a chaque requete et non au demarrage : sans
    #  lui, nginx refuserait de demarrer des que l'application n'est pas dans
    #  le reseau — ce qui est le cas de l'apercu du site seul.
    # ======================================================================
    #  Les trois locations ci-dessous portent « ^~ » : sans lui, une regex
    #  comme `location ~* \.(css|js)$` l'emporterait sur un simple prefixe, et
    #  les fichiers de l'application seraient cherches dans la racine du site
    #  — l'application s'afficherait blanche.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location ^~ /api/ {
        # Un add_header ici annule ceux du niveau serveur — c'est voulu : la CSP
        # du site n'a pas de sens sur des reponses JSON. On redeclare les seuls
        # en-tetes utiles.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        set $bbc_backend "backend:8080";
        proxy_pass http://$bbc_backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (STOMP/SockJS) du temps reel de l'application.
    location ^~ /ws/ {
        set $bbc_backend_ws "backend:8080";
        proxy_pass http://$bbc_backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # L'application, servie sous /app/. Elle DOIT avoir ete construite avec
    # --base-href /app/ (voir frontend/Dockerfile, argument BASE_HREF), sinon
    # ses fichiers seraient demandes a la racine, ou vit le site vitrine.
    location = /app { return 301 /app/; }

    location ^~ /app/ {
        # Idem : redeclarer ici retire volontairement la CSP du site pour
        # l'application. Celle-ci utilise des URL blob: (photos, PDF) et une
        # connexion WebSocket que la CSP du site institutionnel interdirait —
        # l'application deviendrait inutilisable. Elle n'avait de toute facon
        # aucun en-tete de securite avant, on lui en ajoute trois.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        set $bbc_app "frontend:80";
        rewrite ^/app/?(.*)$ /$1 break;
        proxy_pass http://$bbc_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; }

    # Site multi-pages classique : /admissions renvoie vers /admissions.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
