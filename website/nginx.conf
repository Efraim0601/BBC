server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    # En-tetes de securite : le site ne recoit aucune donnee, mais il porte le
    # nom de l'etablissement — on limite ce qu'un tiers peut en faire.
    #
    # ATTENTION : ne pas ajouter d'add_header dans un bloc location. nginx
    # n'herite des add_header du niveau superieur que si le niveau courant n'en
    # declare aucun : un seul add_header dans un location ferait disparaitre
    # tous ceux-ci de la reponse. Le cache est donc pilote par `expires`, qui
    # n'a pas cet effet de bord.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GSAP est servi depuis le site lui-meme : script-src 'self' suffit.
    # Les polices viennent de Google Fonts (voir le <head> des pages).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    # Par defaut : revalidation a chaque visite. Le HTML est modifie a la main
    # par le secretariat, une correction de texte doit se voir immediatement.
    expires -1;

    # Bibliotheques tierces : la version est dans le nom du fichier, le contenu
    # ne changera jamais sous ce nom.
    location ^~ /assets/js/vendor/ {
        expires 1y;
    }

    # Feuille de style et scripts du site : noms fixes, donc cache court, sinon
    # une correction mettrait un mois a atteindre les visiteurs.
    location ~* \.(?:css|js)$ {
        expires 1d;
    }

    location ~* \.(?:png|jpg|jpeg|svg|webp|ico|woff2)$ {
        expires 30d;
    }

    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; }

    # Site multi-pages classique : /admissions renvoie vers /admissions.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
