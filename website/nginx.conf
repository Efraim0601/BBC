server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    # En-tetes de securite : le site ne recoit aucune donnee, mais il porte le
    # nom de l'etablissement — on limite ce qu'un tiers peut en faire.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les feuilles de style et les polices viennent de Google Fonts (voir <head>).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    # Les fichiers statiques changent rarement, mais le HTML doit rester frais :
    # une modification de texte par le secretariat doit se voir au rechargement.
    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; }

    # Site multi-pages classique : /admissions renvoie vers /admissions.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
