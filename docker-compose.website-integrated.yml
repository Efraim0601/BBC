# Site institutionnel + application, sur UNE SEULE ORIGINE.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml \
#     -f docker-compose.website-integrated.yml -p bbc-integre up -d --build
#   → http://localhost:8082          site institutionnel
#   → http://localhost:8082/app/     application de gestion scolaire
#   → http://localhost:8082/api/     API (proxifiee par le site)
#
# POURQUOI UNE SEULE ORIGINE : les jetons de session vivent dans localStorage,
# qui est cloisonne par origine. Une connexion faite sur le site n'ouvre une
# session dans l'application que si les deux partagent hote et port. C'est
# aussi ce qui evite toute configuration CORS.
services:
  # L'application n'est plus publiee directement : on y accede par /app/.
  # Elle est reconstruite avec la bonne base href, sinon ses fichiers seraient
  # demandes a la racine, ou vit le site vitrine.
  frontend:
    build:
      context: ./frontend
      args:
        BASE_HREF: /app/
    ports: !override []
    expose:
      - "80"

  # Le backend reste joignable en interne ; le site le proxifie sous /api/.
  backend:
    ports: !override []
    expose:
      - "8080"

  website:
    build: ./website
    security_opt:
      - apparmor=unconfined
    depends_on:
      - backend
      - frontend
    ports:
      - "8082:80"
    restart: unless-stopped
