# VPS override for the clean production database stack.
# Run with:
#   docker compose --env-file .env.vps-production -p bbc-production \
#     -f docker-compose.server.yml -f docker-compose.vps-production.yml up -d --build
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports: !override
      - "127.0.0.1:25433:5432"
    volumes: !override
      - bbc_production_pgdata:/var/lib/postgresql/data

  backend:
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      BBC_CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be set}
      BBC_JWT_SECRET: ${BBC_JWT_SECRET:?BBC_JWT_SECRET must be set}
      BBC_ADMIN_USERNAME: ${BBC_ADMIN_USERNAME:-admin}
      BBC_ADMIN_PASSWORD: ${BBC_ADMIN_PASSWORD:-}
      BBC_ADMIN_NAME: ${BBC_ADMIN_NAME:-Production Administrator}
      BBC_SCHOOL_NAME: ${BBC_SCHOOL_NAME:-Bayo Bilingual Complex}
      BBC_SCHOOL_CODE: ${BBC_SCHOOL_CODE:-BBC}
    ports: !override
      - "127.0.0.1:28081:8080"
    volumes: !override
      - bbc_production_documents:/data/documents

  frontend:
    ports: !override []
    expose:
      - "80"
    volumes: !override
      - ./frontend/nginx.ssl.production.conf:/etc/nginx/conf.d/default.conf:ro

  # MinIO publie 29000/29001 dans le fichier de base ; le stack `working` les
  # occupe déjà sur ce serveur. On décale ici comme pour db (25433) et backend
  # (28081). Ces ports ne servent qu'à l'administration via tunnel SSH : le
  # backend joint MinIO par le réseau interne (http://minio:9000).
  minio:
    ports: !override
      - "127.0.0.1:29002:9000"
      - "127.0.0.1:29003:9001"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - bbc_production_caddy_data:/data
      - bbc_production_caddy_config:/config
    restart: unless-stopped

volumes:
  bbc_production_pgdata:
    name: bbc-vps-production-pgdata
  bbc_production_documents:
    name: bbc-vps-production-documents
  bbc_production_caddy_data:
    name: bbc-vps-production-caddy-data
  bbc_production_caddy_config:
    name: bbc-vps-production-caddy-config
