# Base stack = PRODUCTION (clean schema, NO demo data).
#   Production : docker compose up -d --build           (or: make prod)
#   Demo       : add the override file docker-compose.demo.yml  (or: make demo)
# See README.md → "Démarrage rapide".
services:
  db:
    image: postgres:16-alpine
    # snap-packaged dockerd (profile snap.docker.dockerd) cannot signal the
    # default container profile on recent kernels -> `docker stop` fails with
    # "permission denied". Running unconfined restores the container lifecycle.
    security_opt:
      - apparmor=unconfined
    environment:
      POSTGRES_DB: bbc_sms
      POSTGRES_USER: bbc
      POSTGRES_PASSWORD: bbc
    ports:
      - "5433:5432"
    volumes:
      - bbc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbc -d bbc_sms"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage objet des fichiers de la bibliotheque de ressources (PDF, Word,
  # images). Volontairement hors de Postgres : un PDF par circulaire ferait
  # enfler le pg_dump. Contrepartie : le volume ci-dessous doit etre sauvegarde
  # a cote de la base.
  #   Console d'administration MinIO : http://localhost:9001
  minio:
    image: minio/minio:latest
    security_opt:
      - apparmor=unconfined
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BBC_STORAGE_ACCESS_KEY:-bbc-storage}
      MINIO_ROOT_PASSWORD: ${BBC_STORAGE_SECRET_KEY:-bbc-storage-secret}
    volumes:
      - bbc_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    security_opt:
      - apparmor=unconfined
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bbc_sms
      # Stockage objet des fichiers de la bibliotheque (bucket PRIVE).
      BBC_STORAGE_ENDPOINT: http://minio:9000
      BBC_STORAGE_ACCESS_KEY: ${BBC_STORAGE_ACCESS_KEY:-bbc-storage}
      BBC_STORAGE_SECRET_KEY: ${BBC_STORAGE_SECRET_KEY:-bbc-storage-secret}
      BBC_STORAGE_BUCKET: ${BBC_STORAGE_BUCKET:-bbc-sms}
      DB_USER: bbc
      DB_PASSWORD: bbc
      BBC_CORS_ORIGINS: http://localhost:4200,http://localhost:8081
      # Override in real deployments:
      BBC_JWT_SECRET: ${BBC_JWT_SECRET:-Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
      # Production first-run admin bootstrap — set these in .env (see .env.example).
      # Ignored in demo mode and once a user already exists.
      BBC_ADMIN_USERNAME: ${BBC_ADMIN_USERNAME:-admin}
      BBC_ADMIN_PASSWORD: ${BBC_ADMIN_PASSWORD:-}
      BBC_ADMIN_NAME: ${BBC_ADMIN_NAME:-Administrateur}
      BBC_SCHOOL_NAME: ${BBC_SCHOOL_NAME:-Mon établissement}
      BBC_SCHOOL_CODE: ${BBC_SCHOOL_CODE:-SCHOOL}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    security_opt:
      - apparmor=unconfined
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  bbc_pgdata:
  bbc_minio:
