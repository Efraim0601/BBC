spring:
  application:
    name: bbc-sms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bbc_sms}
    username: ${DB_USER:bbc}
    password: ${DB_PASSWORD:bbc}
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

bbc:
  security:
    # 256-bit base64 secret. OVERRIDE in production via env BBC_JWT_SECRET.
    jwt-secret: ${BBC_JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
    access-token-minutes: 15
    refresh-token-days: 7
  cors:
    allowed-origins: ${BBC_CORS_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bbc.sms: DEBUG
