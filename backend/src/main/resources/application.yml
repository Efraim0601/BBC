spring:
  application:
    name: bbc-sms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bbc_sms}
    username: ${DB_USER:bbc}
    password: ${DB_PASSWORD:bbc}
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Existing deployments contain retired early migrations (V4/V5/etc.) that
    # are no longer in the repository. Tolerate only missing history entries;
    # checksum mismatches and failed migrations still stop startup.
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      # Bibliothèque de ressources : la limite qui fait foi est celle du service
      # (LibraryService.MAX_BYTES = 25 Mo), qui sait répondre par un message clair.
      # Ces plafonds-ci sont un garde-fou de conteneur, posé juste au-dessus pour
      # laisser le service parler le premier ; au-delà, le refus est un 413.
      max-file-size: 27MB
      max-request-size: 32MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

bbc:
  security:
    # 256-bit base64 secret. OVERRIDE in production via env BBC_JWT_SECRET.
    jwt-secret: ${BBC_JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
    # School workday default (8h). Silent refresh keeps the session beyond this.
    access-token-minutes: ${BBC_ACCESS_TOKEN_MINUTES:480}
    refresh-token-days: ${BBC_REFRESH_TOKEN_DAYS:7}
  cors:
    allowed-origins: ${BBC_CORS_ORIGINS:http://localhost:4200}
  # Stockage objet des fichiers de la bibliothèque (MinIO, compatible S3).
  # Le bucket reste PRIVÉ : les octets ne sortent que par l'API, après contrôle
  # des droits. Le volume MinIO doit être sauvegardé à côté du pg_dump.
  storage:
    endpoint: ${BBC_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${BBC_STORAGE_ACCESS_KEY:bbc-storage}
    secret-key: ${BBC_STORAGE_SECRET_KEY:bbc-storage-secret}
    bucket: ${BBC_STORAGE_BUCKET:bbc-sms}
  # First-run PRODUCTION bootstrap (skipped once any user exists, e.g. demo).
  # Set BBC_ADMIN_PASSWORD to create the initial school + admin on an empty DB.
  bootstrap:
    enabled: ${BBC_BOOTSTRAP_ENABLED:true}
    admin-username: ${BBC_ADMIN_USERNAME:admin}
    admin-password: ${BBC_ADMIN_PASSWORD:}
    admin-name: ${BBC_ADMIN_NAME:Administrateur}
    school-name: ${BBC_SCHOOL_NAME:Mon établissement}
    school-code: ${BBC_SCHOOL_CODE:SCHOOL}
    year-label: ${BBC_YEAR_LABEL:2025-2026}
  documents:
    storage-path: ${BBC_DOCUMENT_STORAGE:/data/documents}
  # Never enable this in a production profile. The isolated acceptance
  # compose file activates both the e2e profile and this explicit switch.
  e2e:
    fixtures:
      enabled: ${BBC_E2E_FIXTURES_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bbc.sms: DEBUG
